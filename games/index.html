<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Infinite World - Island Explorer</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#101b28;color:#fff;font-family:system-ui,sans-serif}canvas{display:block}
#ui{position:fixed;inset:0;pointer-events:none}.panel{pointer-events:auto;background:#102033d9;border:1px solid #ffffff30;border-radius:14px;padding:12px;backdrop-filter:blur(8px)}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}#brand{font-weight:800;font-size:14px}#status{font-size:12px;color:#d7e8f2;margin-top:4px}.buttons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}button{pointer-events:auto;border:1px solid #ffffff35;background:#263e55;color:#fff;border-radius:9px;padding:9px 11px;font-weight:700;cursor:pointer}button.active{background:#d58a45;color:#1b1820;border-color:#ffd29a}#help{position:absolute;bottom:14px;left:14px;max-width:320px;font-size:12px;line-height:1.5}#toast{position:absolute;top:88px;left:50%;transform:translateX(-50%);font-weight:800;background:#14283be8;border-radius:20px;padding:9px 16px;opacity:0;transition:opacity .2s}#touch{position:absolute;bottom:14px;right:14px;display:none;gap:8px;pointer-events:auto}#touch button{width:52px;height:52px;font-size:20px;opacity:.85}@media(max-width:700px){#top{flex-direction:column}#top .buttons{justify-content:flex-start}#help{bottom:82px}#touch{display:flex}}
</style>
</head>
<body>
<div id="ui">
 <div id="top"><div class="panel"><div id="brand">INFINITE WORLD / 01 EXPLORER</div><div id="status">宝石 0 / 8　|　島を探索しよう</div></div>
 <div class="buttons"><button id="explore" class="active">探索</button><button id="survival">サバイバル</button><button id="rpg">アクションRPG</button><button id="build">建築</button></div></div>
 <div id="toast"></div><div id="help" class="panel">WASD / 矢印キー：移動　|　Space：ジャンプ<br>青い光る宝石を集めよう。スマホは右下のボタンでも移動できます。</div>
 <div id="touch"><div style="display:grid;grid-template-columns:repeat(3,52px);gap:5px"><span></span><button data-key="ArrowUp">↑</button><span></span><button data-key="ArrowLeft">←</button><button data-key="ArrowDown">↓</button><button data-key="ArrowRight">→</button></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=>{
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc7df);scene.fog=new THREE.Fog(0x9bc7df,28,75);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,150);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9f1ff,0x43513a,2));
const sun=new THREE.DirectionalLight(0xffe0b5,2.3);sun.position.set(-8,18,10);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.9)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const grass=mat(0x477b42),soil=mat(0x59402e),wood=mat(0x80502f),roof=mat(0xb95735),leaf=mat(0x205b39),leaf2=mat(0x34744a),stone=mat(0x68747a),pathmat=mat(0xc0a47b),gold=mat(0x45d9ff,.25);
const island=new THREE.Group();scene.add(island);
const ground=new THREE.Mesh(new THREE.CylinderGeometry(10.3,8.2,2.6,9,1),soil);ground.position.y=-.2;ground.scale.z=.92;ground.castShadow=true;ground.receiveShadow=true;island.add(ground);
const top=new THREE.Mesh(new THREE.CylinderGeometry(10.15,10.15,.28,9),grass);top.position.y=1.12;top.receiveShadow=true;island.add(top);
const meadow=new THREE.Mesh(new THREE.CircleGeometry(9.8,9),grass);meadow.rotation.x=-Math.PI/2;meadow.position.y=1.27;island.add(meadow);
function box(x,y,z,sx,sy,sz,m){const o=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;island.add(o);return o}
function tree(x,z,s=1){const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12*s,.17*s,1.1*s,7),wood);trunk.position.set(x,1.8*s,z);trunk.castShadow=true;island.add(trunk);for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.ConeGeometry((.78-i*.15)*s,.95*s,8),i===1?leaf2:leaf);crown.position.set(x,2.35*s+i*.48*s,z);crown.castShadow=true;island.add(crown)}}
[[-6,-4,1.1],[-7,1,.9],[-4,5,1],[5,5,1.1],[7,1,.85],[6,-5,1],[-2,-7,.8]].forEach(a=>tree(...a));
box(1,2.05,1.2,3,1.8,2.5,wood);
const roof1=new THREE.Mesh(new THREE.ConeGeometry(2.35,1.55,4),roof);roof1.rotation.y=Math.PI/4;roof1.position.set(1,3.6,1.2);roof1.scale.set(1,.75,.8);roof1.castShadow=true;island.add(roof1);
box(1,1.75,-.09,.65,1.2,.12,soil);box(0,2.25,-.11,.48,.5,.08,mat(0x78c9dc,.25));box(2,2.25,-.11,.48,.5,.08,mat(0x78c9dc,.25));
for(let i=0;i<18;i++){let t=i/17,x=-5+t*5.2,z=-5+t*4+Math.sin(t*Math.PI*2)*.35;const p=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.09,7),pathmat);p.position.set(x,1.43,z);p.rotation.y=i*.3;island.add(p)}
[[-8,-1,.7],[8,3,.8],[-3,7,.55],[4,-7,.65]].forEach(([x,z,s])=>{let r=new THREE.Mesh(new THREE.IcosahedronGeometry(s,0),stone);r.position.set(x,1.4,z);r.castShadow=true;island.add(r)});
const player=new THREE.Group();scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.75,4,8),mat(0xe5a34e));body.position.y=.8;body.castShadow=true;player.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10),mat(0xf0c99d));head.position.y=1.48;player.add(head);
const pack=new THREE.Mesh(new THREE.BoxGeometry(.42,.48,.2),mat(0x395b72));pack.position.set(0,.85,.36);player.add(pack);
player.position.set(-4,1.5,-5);
const gems=[];for(let i=0;i<8;i++){let a=i*Math.PI*2/8+.2,x=Math.cos(a)*(5.8+(i%2)),z=Math.sin(a)*(5.8+(i%2));let g=new THREE.Mesh(new THREE.OctahedronGeometry(.38),gold);g.position.set(x,2,z);g.userData.baseY=2;island.add(g);gems.push(g)}
const keys={};let mode='explore',collected=0,hp=100,food=100,woodCount=0,score=0,vy=0,buildings=[];
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=false);
document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;b.addEventListener('pointerdown',e=>{keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});
const status=document.getElementById('status'),help=document.getElementById('help'),toast=document.getElementById('toast');
function say(s){toast.textContent=s;toast.style.opacity=1;clearTimeout(say.t);say.t=setTimeout(()=>toast.style.opacity=0,1700)}
function setMode(m){mode=m;document.querySelectorAll('.buttons button').forEach(b=>b.classList.toggle('active',b.id===m));if(m==='explore'){help.innerHTML='WASD / 矢印キー：移動　|　Space：ジャンプ<br>青い光る宝石を集めて島を探検しよう。';say('探索モード');}
if(m==='survival'){help.innerHTML='木に近づいて E：木材を集める<br>体力と食料を管理して生き残ろう。';say('サバイバル開始！');}
if(m==='rpg'){help.innerHTML='クリック または F：近くの敵を攻撃<br>島に現れるスライムを倒そう。';say('冒険者よ、武器を構えよう！');}
if(m==='build'){help.innerHTML='クリック：足元の近くに小屋を建築（木材3）<br>サバイバルで木材を集めてから建築しよう。';say('建築モード');}}
['explore','survival','rpg','build'].forEach(id=>document.getElementById(id).onclick=()=>setMode(id));
const enemies=[];for(let i=0;i<3;i++){const e=new THREE.Mesh(new THREE.SphereGeometry(.55,12,10),mat(0x8d70d6));e.position.set(4+i*1.5,1.7,-2+i*2);e.castShadow=true;e.userData.hp=3;e.visible=false;island.add(e);enemies.push(e)}
function nearestTree(){let best=null,d=99;island.children.forEach(o=>{if(o.name==='treeTrunk'){let n=o.position.distanceTo(player.position);if(n<d){d=n;best=o}}});return best}
const trunks=[];island.children.forEach(o=>{if(o.geometry&&o.geometry.type==='CylinderGeometry'&&o.position.y>1.5&&o.position.y<3)trunks.push(o)});
let attackCooldown=0;
renderer.domElement.addEventListener('pointerdown',()=>{if(mode==='rpg')attack() ;if(mode==='build')build()});
function attack(){if(attackCooldown>0)return;attackCooldown=.35;let e=enemies.find(q=>q.visible&&q.position.distanceTo(player.position)<3&&q.userData.hp>0);if(e){e.userData.hp--;score+=10;if(e.userData.hp<=0){e.visible=false;score+=30;say('スライムを倒した！ +40 XP')}else say('攻撃！');}else say('敵が近くにいない');}
function build(){if(woodCount<3){say('木材が足りない！ 木を集めよう');return}woodCount-=3;let b=new THREE.Group();let x=player.position.x,z=player.position.z;let base=new THREE.Mesh(new THREE.BoxGeometry(1.8,1.6,1.8),wood);base.position.y=.8;b.add(base);let r=new THREE.Mesh(new THREE.ConeGeometry(1.45,1,4),roof);r.position.y=2;b.add(r);b.position.set(x,1.4,z);island.add(b);buildings.push(b);say('小さな小屋を建てた！')}
function updateStatus(){if(mode==='explore')status.textContent='宝石 '+collected+' / 8';if(mode==='survival')status.textContent='体力 '+Math.round(hp)+'　食料 '+Math.round(food)+'　木材 '+woodCount;if(mode==='rpg')status.textContent='HP '+Math.round(hp)+'　XP '+score;if(mode==='build')status.textContent='木材 '+woodCount+'　建築数 '+buildings.length}
let last=performance.now();function animate(now){requestAnimationFrame(animate);let dt=Math.min((now-last)/1000,.04);last=now;const speed=5*dt;let dx=0,dz=0;if(keys.KeyW||keys.ArrowUp)dz-=1;if(keys.KeyS||keys.ArrowDown)dz+=1;if(keys.KeyA||keys.ArrowLeft)dx-=1;if(keys.KeyD||keys.ArrowRight)dx+=1;let len=Math.hypot(dx,dz)||1;player.position.x+=dx/len*speed;player.position.z+=dz/len*speed;player.position.x=Math.max(-9,Math.min(9,player.position.x));player.position.z=Math.max(-9,Math.min(9,player.position.z));if(dx||dz)player.rotation.y=Math.atan2(dx,dz);
if(keys.Space&&player.position.y<=1.51)vy=7;vy-=18*dt;player.position.y+=vy*dt;if(player.position.y<1.5){player.position.y=1.5;vy=0}
if(mode==='explore'){gems.forEach(g=>{if(g.visible&&g.position.distanceTo(player.position)<1.15){g.visible=false;collected++;say('宝石を見つけた！');}});if(collected===8&&gems.some(g=>g.visible)){}if(collected===8&& !animate.done){animate.done=true;say('全ての宝石を集めた！ 島の探索完了！')}}
if(mode==='survival'){food=Math.max(0,food-dt*.8);if(food===0)hp=Math.max(0,hp-dt*3);if(keys.KeyE){let t=trunks.find(t=>t.position.distanceTo(player.position)<2.5);if(t&&(!t.userData.last||now-t.userData.last>700)){t.userData.last=now;woodCount++;say('木材 +1')}}if(hp<=0)say('体力が尽きた！')}
if(mode==='rpg'){enemies.forEach((e,i)=>{e.visible=e.userData.hp>0;if(e.visible){e.position.y=1.7+Math.sin(now*.004+i)*.12;let d=e.position.distanceTo(player.position);if(d<1.3&&Math.random()<dt*.35)hp=Math.max(0,hp-2)}});if(keys.KeyF)attack();attackCooldown=Math.max(0,attackCooldown-dt)}
gems.forEach((g,i)=>{if(g.visible){g.rotation.y+=dt*1.4;g.position.y=2+Math.sin(now*.002+i)*.18}});
const target=new THREE.Vector3(player.position.x+9,player.position.y+8,player.position.z+11);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+.5,player.position.z);
updateStatus();renderer.render(scene,camera)}
requestAnimationFrame(animate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})();
</script></body></html>
